<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<base href="../">
<title>Επιστολή · Μεγάλη Γραμματεία ΕΜΣτΕ</title>
<link rel="icon" href="programme/emblem.jpg">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body{background:#eef0f5;margin:0}
  .lbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px;background:#1d2f5e;color:#fff;font:600 15px/1.3 Georgia,serif}
  .lbar a,.lbar button{display:inline-block;padding:8px 14px;border-radius:6px;border:1px solid #e9dcc0;background:#fff;color:#1d2f5e;text-decoration:none;font:700 14px/1.2 system-ui,sans-serif;cursor:pointer}
  .lbar a.back{background:none;color:#fff}
  .lbar [hidden]{display:none!important}
  .lwrap{padding:12px 0 30px}
  .lmsg{text-align:center;color:#6b7790;font-style:italic;padding:40px 16px}
  @media print{.lbar{display:none!important}body{background:#fff}.lwrap{padding:0}.paper{box-shadow:none;margin:0 auto}}
</style>
</head>
<body>
<div class="lbar noprint"><a class="back" href="programme/">← Πρόγραμμα επισκέψεων</a><span id="lt">Επιστολή</span><button type="button" id="pr">🖨 Εκτύπωση / PDF</button><a id="pdf" href="#" target="_blank" rel="noopener" hidden>📄 PDF</a></div>
<div class="lwrap print-area" id="l"><p class="lmsg">Φόρτωση…</p></div>
<script>
(function () {
  var p = new URLSearchParams(location.search).get('p') || '', box = document.getElementById('l');
  document.getElementById('pr').onclick = function () { window.print(); };
  fetch('programme/programme.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    var x = (d.letters || {})[p];
    if (!x || !x.html) { box.innerHTML = '<p class="lmsg">Η επιστολή με Αρ. Πρωτ. ' + p.replace(/[^\d]/g, '') + ' δεν είναι διαθέσιμη.</p>'; return; }
    box.innerHTML = x.html;
    document.getElementById('lt').textContent = 'Αρ. Πρωτ. ' + p.replace(/[^\d]/g, '');
    document.title = 'Επιστολή ' + p.replace(/[^\d]/g, '') + ' · Μεγάλη Γραμματεία ΕΜΣτΕ';
    if (x.pdf && /^https:\/\//.test(x.pdf)) { var a = document.getElementById('pdf'); a.href = x.pdf; a.hidden = false; }
  }).catch(function () { box.innerHTML = '<p class="lmsg">Η επιστολή δεν είναι διαθέσιμη αυτή τη στιγμή.</p>'; });
})();
</script>
<a class="srcbadge" href="https://github.com/NGLG-GSEC/NGLG-Grand-Secretary/blob/main/programme/letter.html" target="_blank" rel="noopener" title="Κώδικας αυτής της σελίδας στο GitHub" style="position:fixed;top:2px;left:4px;z-index:2147483647;font:11px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;color:#8a8f99;text-decoration:none;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:3px;pointer-events:auto">github.com/NGLG-GSEC/NGLG-Grand-Secretary</a><style>@media print{.srcbadge{display:none!important}}</style>
</body>
</html>
