name: App tests

on:
  push:
    paths: ['app/**', 'core/**', 'modules/**', 'css/**', 'img/**', 'seed/**', 'vendor/**', 'tests/**', 'diatagma/**', 'index.html', 'main.js', '.github/workflows/app-tests.yml']
  pull_request:
    paths: ['app/**', 'core/**', 'modules/**', 'css/**', 'img/**', 'seed/**', 'vendor/**', 'tests/**', 'diatagma/**', 'index.html', 'main.js', '.github/workflows/app-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Έλεγχοι εφαρμογής (Chromium)
        run: python -m pytest -q tests
