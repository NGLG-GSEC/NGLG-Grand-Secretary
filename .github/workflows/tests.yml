name: Tests

on:
  push:
    paths: ['letter-manager/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['letter-manager/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nglg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: letter-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: letter-manager/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (${{ matrix.db }})
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/nglg_test' || '' }}
        run: python -m pytest -q tests
