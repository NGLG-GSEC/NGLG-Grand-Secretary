name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Δημόσιο πρόγραμμα επισκέψεων (programme/): ανανέωση από τα ιδιωτικά δεδομένα κάθε 10 λεπτά
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Έκδοση στα αρχεία (νέα έκδοση χωρίς παλιά cache)
        run: python3 tools/stamp_version.py "${GITHUB_SHA}"
      - name: Δημόσιο πρόγραμμα επισκέψεων (από τα ιδιωτικά δεδομένα)
        # Χρειάζεται το secret DATA_REPO_TOKEN: κλειδί GitHub μόνο για ανάγνωση του αποθετηρίου δεδομένων.
        # Δημοσιεύεται μόνο το files/public/programme.json που γράφει η εφαρμογή (ημερομηνία, Στοά, Επαρχία, εκπρόσωπος).
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO || 'NGLG-GSEC/nglg-grammateia-data' }}
        run: |
          if [ -z "$DATA_TOKEN" ]; then echo "Δεν έχει οριστεί το DATA_REPO_TOKEN — η σελίδα programme/ μένει χωρίς δεδομένα."; exit 0; fi
          curl -fsSL -H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$DATA_REPO/contents/files/public/programme.json" -o programme/programme.json \
            && python3 -c "import json; d=json.load(open('programme/programme.json')); print('Πρόγραμμα:', len(d.get('rows', [])), 'επισκέψεις')" \
            || { echo "Δεν βρέθηκε ακόμη πρόγραμμα στα δεδομένα."; rm -f programme/programme.json; }
          # Εργασίες για τη σελίδα Δηλώσεων (declarations/): οι Επισκέψεις της εφαρμογής (ημερομηνία, Στοά, αριθμός, Επαρχία)
          curl -fsSL -H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$DATA_REPO/contents/files/public/meetings.json" -o declarations/meetings.json \
            && python3 -c "import json; d=json.load(open('declarations/meetings.json')); print('Εργασίες:', len(d.get('meetings', [])))" \
            || { echo "Δεν βρέθηκαν ακόμη Εργασίες στα δεδομένα."; rm -f declarations/meetings.json; }
          # Κατάλογος Μεγάλων Αξιωματικών (από την Επετηρίδα της εφαρμογής) για τη σελίδα Δηλώσεων
          curl -fsSL -H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$DATA_REPO/contents/files/public/officers.json" -o declarations/officers.json \
            && python3 -c "import json; d=json.load(open('declarations/officers.json')); print('Αξιωματικοί:', len(d.get('officers', [])))" \
            || { echo "Δεν βρέθηκε ακόμη κατάλογος αξιωματικών· μένει το officers.js."; rm -f declarations/officers.json; }
      - name: Πύλη Γραμματέων Στοών (διεύθυνση του Apps Script)
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO || 'NGLG-GSEC/nglg-grammateia-data' }}
        run: |
          if [ -z "$DATA_TOKEN" ]; then exit 0; fi
          # Μόνο η διεύθυνση /exec (όχι κωδικοί ή δεδομένα): {"api_url": "..."}
          curl -fsSL -H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$DATA_REPO/contents/files/public/lodge-portal.json" -o lodge/portal.json \
            && python3 -c "import json; d=json.load(open('lodge/portal.json')); assert set(d) <= {'api_url'}; print('Πύλη:', 'ενεργή' if d.get('api_url') else 'χωρίς URL')" \
            || { echo "Η Πύλη Γραμματέων δεν έχει ρυθμιστεί ακόμη."; rm -f lodge/portal.json; }
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Αν συμπέσει με άλλη δημοσίευση (π.χ. την αυτόματη ανά 10 λεπτά), νέα προσπάθεια σε λίγο
      - name: Αναμονή πριν τη νέα προσπάθεια
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - name: Deploy (νέα προσπάθεια)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
