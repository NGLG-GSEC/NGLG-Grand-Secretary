services:
  - type: web
    name: nglg-letter-manager
    runtime: docker
    branch: main
    dockerContext: ./letter-manager
    dockerfilePath: ./letter-manager/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: grand.secretary@nglgreece.gr
      - key: COOKIE_SECURE
        value: "1"
      - key: DEV_SHOW_OTP
        value: "0"
      - key: DATA_DIR
        value: /var/data
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: grand.secretary@nglgreece.gr
      - key: OTP_FROM_EMAIL
        value: grand.secretary@nglgreece.gr
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://nglg-letter-manager.onrender.com
      - key: PRIMARY_ADMIN_EMAIL
        sync: false
      - key: PRIMARY_ADMIN_PASSWORD_HASH
        sync: false
    disk:
      name: nglg-letter-manager-data
      mountPath: /var/data
      sizeGB: 1
